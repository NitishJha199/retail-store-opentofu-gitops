name: 🔄 Continuous Integration

on:
  push:
    branches: [ gitops, main, develop ]
  pull_request:
    branches: [ gitops, main ]
  workflow_dispatch:

env:
  AWS_REGION: "us-west-2"

  # CodeDNA evidence run:
  # build GHCR images + SBOMs without ECR/Helm/EKS deployment chain.
  CODEDNA_EVIDENCE_ONLY: "true"

jobs:
  code-quality:
    name: 🔍 Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Super-Linter
        uses: super-linter/super-linter@v6.8.0
        env:
          DEFAULT_BRANCH: gitops
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_DOCKERFILE: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_TERRAFORM_TFLINT: false  # We use OpenTofu
          VALIDATE_KUBERNETES_KUBECONFORM: true

  detect-changes:
    name: 🔍 Detect Service Changes
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
      catalog: ${{ steps.changes.outputs.catalog }}
      cart: ${{ steps.changes.outputs.cart }}
      orders: ${{ steps.changes.outputs.orders }}
      checkout: ${{ steps.changes.outputs.checkout }}
      any-service: ${{ steps.changes.outputs.any-service }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Detect Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            ui:
              - 'src/ui/**'
            catalog:
              - 'src/catalog/**'
            cart:
              - 'src/cart/**'
            orders:
              - 'src/orders/**'
            checkout:
              - 'src/checkout/**'
            any-service:
              - 'src/**'

  test-java-services:
    name: ☕ Test Java Services
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service == 'true'
    strategy:
      matrix:
        service: [ui, cart, orders]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: 🧪 Test Java Service
        if: needs.detect-changes.outputs[matrix.service] == 'true'
        run: |
          if [ -f "src/${{ matrix.service }}/pom.xml" ]; then
            cd src/${{ matrix.service }}
            ./mvnw test
          else
            echo "No Java project found for ${{ matrix.service }}"
          fi

  test-go-services:
    name: 🐹 Test Go Services
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.catalog == 'true'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 🧪 Test Go Service
        run: |
          cd src/catalog
          go test ./...

  test-node-services:
    name: 🟢 Test Node.js Services
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.checkout == 'true'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/checkout/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd src/checkout
          npm ci

      - name: 🧪 Run Tests
        run: |
          cd src/checkout
          npm test

  build-and-push-to-ecr:
    name: 🐳 Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [detect-changes, test-java-services, test-go-services, test-node-services]
    if: |
      always() &&
      env.CODEDNA_EVIDENCE_ONLY != 'true' &&
      needs.detect-changes.outputs.any-service == 'true' &&
      (needs.test-java-services.result == 'success' || needs.test-java-services.result == 'skipped') &&
      (needs.test-go-services.result == 'success' || needs.test-go-services.result == 'skipped') &&
      (needs.test-node-services.result == 'success' || needs.test-node-services.result == 'skipped') &&
      github.ref == 'refs/heads/gitops'
    strategy:
      matrix:
        service: [ui, catalog, cart, orders, checkout]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Create ECR Repository if not exists
        run: |
          aws ecr describe-repositories --repository-names retail-store-${{ matrix.service }} || \
          aws ecr create-repository --repository-name retail-store-${{ matrix.service }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and Push Docker Image
        if: needs.detect-changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: retail-store-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build and push image
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./src/${{ matrix.service }}
          
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: 🛡️ Scan Image for Vulnerabilities
        if: needs.detect-changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: retail-store-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Wait for scan to complete
          aws ecr wait image-scan-complete \
            --repository-name $ECR_REPOSITORY \
            --image-id imageTag=$IMAGE_TAG || true
          
          # Get scan results
          aws ecr describe-image-scan-findings \
            --repository-name $ECR_REPOSITORY \
            --image-id imageTag=$IMAGE_TAG || true

  update-helm-values:
    name: 📝 Update Helm Values with New Images
    runs-on: ubuntu-latest
    needs: [build-and-push-to-ecr, detect-changes]
    if: |
      always() && 
      needs.build-and-push-to-ecr.result == 'success' &&
      github.ref == 'refs/heads/gitops'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📝 Update Helm Values
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Get AWS Account ID
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          
          # Update each service's values.yaml with new image tag and ECR registry
          for service in ui catalog cart orders checkout; do
            if [ "${{ needs.detect-changes.outputs[service] }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              VALUES_FILE="src/${service}/chart/values.yaml"
              
              # Update global ECR registry configuration
              sed -i "s|accountId: \".*\"|accountId: \"${AWS_ACCOUNT_ID}\"|g" $VALUES_FILE
              
              # Update image tag
              sed -i "s|tag: \".*\"|tag: \"${IMAGE_TAG}\"|g" $VALUES_FILE
              
              echo "Updated $VALUES_FILE with new image tag: $IMAGE_TAG"
            fi
          done

      - name: 📤 Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add src/*/chart/values.yaml
            git commit -m "🚀 Update container images to ${{ github.sha }}
            
            Updated images:
            $(git diff --name-only HEAD~1 | grep values.yaml | sed 's|src/||g' | sed 's|/chart/values.yaml||g' | tr '\n' ' ')
            
            Triggered by: ${{ github.actor }}
            Commit: ${{ github.sha }}"
            
            git push
          fi

  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-push-to-ecr, update-helm-values, detect-changes]
    if: always() && github.ref == 'refs/heads/gitops'
    steps:
      - name: 📊 Create Deployment Summary
        run: |
          echo "## 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed | Build Status | Image Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|--------------|-----------|" >> $GITHUB_STEP_SUMMARY
          
          for service in ui catalog cart orders checkout; do
            changed="${{ needs.detect-changes.outputs[service] }}"
            if [ "$changed" == "true" ]; then
              status="✅ Built"
              tag="${{ github.sha }}"
            else
              status="⏭️ Skipped"
              tag="No change"
            fi
            echo "| **$service** | $changed | $status | \`$tag\` |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** ${{ needs.build-and-push-to-ecr.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Update Status:** ${{ needs.update-helm-values.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Next Step:** ArgoCD will automatically detect and deploy the updated images to EKS cluster." >> $GITHUB_STEP_SUMMARY
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🧪 Run Tests
        run: |
          if [ -f "src/${{ matrix.service }}/pom.xml" ]; then
            cd src/${{ matrix.service }}
            ./mvnw clean test
          else
            echo "No Maven project found for ${{ matrix.service }}"
          fi

      - name: 📊 Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Java Tests - ${{ matrix.service }}
          path: src/${{ matrix.service }}/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  test-go-services:
    name: 🐹 Test Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 📦 Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: 🧪 Run Tests
        run: |
          if [ -f "src/${{ matrix.service }}/go.mod" ]; then
            cd src/${{ matrix.service }}
            go test -v ./... -coverprofile=coverage.out
            go tool cover -html=coverage.out -o coverage.html
          else
            echo "No Go project found for ${{ matrix.service }}"
          fi

      - name: 📤 Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-${{ matrix.service }}
          path: src/${{ matrix.service }}/coverage.html

  test-node-services:
    name: 🟢 Test Node.js Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [checkout]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: src/${{ matrix.service }}/yarn.lock

      - name: 📦 Install Dependencies
        run: |
          if [ -f "src/${{ matrix.service }}/package.json" ]; then
            cd src/${{ matrix.service }}
            yarn install --frozen-lockfile
          else
            echo "No Node.js project found for ${{ matrix.service }}"
          fi

      - name: 🧪 Run Tests
        run: |
          if [ -f "src/${{ matrix.service }}/package.json" ]; then
            cd src/${{ matrix.service }}
            yarn test:ci || yarn test || echo "No tests configured"
          fi

      - name: 🔍 Lint Code
        run: |
          if [ -f "src/${{ matrix.service }}/package.json" ]; then
            cd src/${{ matrix.service }}
            yarn lint || echo "No linting configured"
          fi

  build-images:
    name: 🐳 Build Container Images
    runs-on: ubuntu-latest
    needs: [test-java-services, test-go-services, test-node-services]
    if: github.event_name == 'push' && github.ref == 'refs/heads/gitops'
    strategy:
      matrix:
        service: [ui, catalog, cart, orders, checkout]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.service }}
          file: ./src/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  generate-sboms:
    name: 📦 Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/gitops'

    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        service: [ui, catalog, cart, orders, checkout]

    steps:
      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Pull service image
        run: |
          docker pull \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}"

      - name: 📦 Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: codedna-sbom-${{ matrix.service }}.cyclonedx.json
          upload-artifact: false

      - name: 🔎 Validate CycloneDX SBOM
        run: |
          python3 - <<'PYVALIDATE'
          import json
          from pathlib import Path

          path = Path(
              "codedna-sbom-${{ matrix.service }}.cyclonedx.json"
          )

          payload = json.loads(path.read_text())

          if payload.get("bomFormat") != "CycloneDX":
              raise SystemExit(
                  f"Invalid SBOM format: {payload.get('bomFormat')}"
              )

          components = payload.get("components", [])

          print("SBOM:", path)
          print("bomFormat:", payload.get("bomFormat"))
          print("specVersion:", payload.get("specVersion"))
          print("components:", len(components))

          if not isinstance(components, list):
              raise SystemExit("CycloneDX components is not a list")
          PYVALIDATE

      - name: 📤 Upload CodeDNA SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codedna-sbom-${{ matrix.service }}
          path: codedna-sbom-${{ matrix.service }}.cyclonedx.json
          if-no-files-found: error
          retention-days: 14

  security-scan-images:
    name: 🛡️ Security Scan Images
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/gitops'
    strategy:
      matrix:
        service: [ui, catalog, cart, orders, checkout]
    steps:
      - name: 🛡️ Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'

      - name: 📤 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  integration-tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/gitops'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Compose
        run: |
          # Create a simple docker-compose for integration testing
          cat > docker-compose.test.yml << EOF
          version: '3.8'
          services:
            catalog:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-catalog:${{ github.sha }}
              ports:
                - "8001:8080"
              environment:
                - DB_ENDPOINT=localhost
            cart:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cart:${{ github.sha }}
              ports:
                - "8002:8080"
              environment:
                - DYNAMODB_ENDPOINT=http://localhost:8000
          EOF

      - name: 🧪 Run Integration Tests
        run: |
          # Start services
          docker-compose -f docker-compose.test.yml up -d
          
          # Wait for services to be ready
          sleep 30
          
          # Basic health checks
          curl -f http://localhost:8001/health || echo "Catalog health check failed"
          curl -f http://localhost:8002/health || echo "Cart health check failed"
          
          # Cleanup
          docker-compose -f docker-compose.test.yml down

  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build-images, security-scan-images, integration-tests]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/gitops'
    steps:
      - name: 📊 Create Summary
        run: |
          echo "## 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Images | ${{ needs.build-images.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan-images.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY