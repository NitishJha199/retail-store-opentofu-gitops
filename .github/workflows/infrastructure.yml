name: 🏗️ Infrastructure Deployment

on:
  push:
    branches: [ gitops, main ]
    paths:
      - 'open-tofu/**'
      - '.github/workflows/infrastructure.yml'
  pull_request:
    branches: [ gitops, main ]
    paths:
      - 'open-tofu/**'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  TF_VERSION: "1.11.3"
  AWS_REGION: "us-west-2"

jobs:
  validate:
    name: 🔍 Validate OpenTofu
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: 🔍 Format Check
        run: tofu fmt -check -recursive
        working-directory: ./open-tofu

      - name: ✅ Validate Configuration
        run: |
          tofu init -backend=false
          tofu validate
        working-directory: ./open-tofu

      - name: 🛡️ Security Scan with tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./open-tofu
          soft_fail: true

  plan:
    name: 📋 Plan Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    environment: 
      name: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🚀 Initialize OpenTofu
        run: tofu init
        working-directory: ./open-tofu

      - name: 📋 Plan Infrastructure
        run: |
          tofu plan -out=tfplan -var="environment=${{ github.event.inputs.environment || 'dev' }}"
          tofu show -no-color tfplan > plan.txt
        working-directory: ./open-tofu

      - name: 📝 Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('./open-tofu/plan.txt', 'utf8');
            const maxLength = 65000; // GitHub comment limit
            const truncatedPlan = plan.length > maxLength ? 
              plan.substring(0, maxLength) + '\n\n... (truncated)' : plan;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 OpenTofu Plan
              
              <details>
              <summary>Click to expand plan</summary>
              
              \`\`\`hcl
              ${truncatedPlan}
              \`\`\`
              
              </details>
              
              **Environment:** ${{ github.event.inputs.environment || 'dev' }}
              **Triggered by:** @${{ github.actor }}
              `
            });

      - name: 📤 Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment || 'dev' }}
          path: ./open-tofu/tfplan
          retention-days: 5

  apply:
    name: 🚀 Apply Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: |
      (github.ref == 'refs/heads/gitops' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment: 
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ steps.deploy.outputs.cluster_endpoint }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🚀 Initialize OpenTofu
        run: tofu init
        working-directory: ./open-tofu

      - name: 🏗️ Apply Infrastructure
        id: deploy
        run: |
          tofu apply -auto-approve -var="environment=${{ github.event.inputs.environment || 'dev' }}"
          echo "cluster_endpoint=$(tofu output -raw cluster_endpoint)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(tofu output -raw cluster_name)" >> $GITHUB_OUTPUT
        working-directory: ./open-tofu

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.33.0'

      - name: ⚙️ Configure kubectl
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ steps.deploy.outputs.cluster_name }}
          kubectl cluster-info

      - name: 📊 Infrastructure Summary
        run: |
          echo "## 🎉 Infrastructure Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster Name** | \`${{ steps.deploy.outputs.cluster_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster Endpoint** | \`${{ steps.deploy.outputs.cluster_endpoint }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ github.event.inputs.environment || 'dev' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. ArgoCD will automatically deploy applications" >> $GITHUB_STEP_SUMMARY
          echo "2. Monitor deployment in ArgoCD UI" >> $GITHUB_STEP_SUMMARY
          echo "3. Access application via load balancer URL" >> $GITHUB_STEP_SUMMARY

  destroy:
    name: 💥 Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: 
      name: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🚀 Initialize OpenTofu
        run: tofu init
        working-directory: ./open-tofu

      - name: 💥 Destroy Infrastructure
        run: |
          tofu destroy -auto-approve -var="environment=${{ github.event.inputs.environment || 'dev' }}"
        working-directory: ./open-tofu

      - name: 📊 Destruction Summary
        run: |
          echo "## 💥 Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All AWS resources have been successfully destroyed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Destroyed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY